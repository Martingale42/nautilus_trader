[package]
name = "nautilus-mt5"
version = "0.52.0"
edition = "2021"
authors = ["NautilusTrader Contributors"]
description = "MetaTrader 5 adapter for NautilusTrader"
license = "LGPL-3.0-or-later"

[lib]
name = "nautilus_mt5"
crate-type = ["rlib", "cdylib"]

[dependencies]
# Core Nautilus dependencies
nautilus-common = { path = "../../common" }
nautilus-core = { path = "../../core" }
nautilus-model = { path = "../../model" }

# ZeroMQ
zmq = "0.10"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"

# Utils
ustr = { version = "1.0", features = ["serde"] }
indexmap = "2.5"

# Python bindings (optional)
pyo3 = { version = "0.26", features = ["extension-module"], optional = true }
pyo3-async-runtimes = { version = "0.26", features = ["tokio-runtime"], optional = true }

[dev-dependencies]
rstest = "0.23"

[features]
default = []
extension-module = ["pyo3/extension-module"]
python = [
    "pyo3",
    "pyo3-async-runtimes",
    "nautilus-core/python",
    "nautilus-model/python",
]
